<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站首页 - 专业大方设计</title>
    <style>
        /* 全局样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        h1, h2 {
            color: #2c3e50;
        }

        /* 导航栏样式 */
        nav {
            background-color: #34495e;
            padding: 15px 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* 首页大图展示 */
        .hero {
            background-image: url('https://via.placeholder.com/1920x600'); /* 你可以替换成实际图片 */
            background-size: cover;
            background-position: center;
            height: 400px;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .hero h1 {
            font-size: 50px;
            font-weight: bold;
        }

        .hero p {
            font-size: 20px;
            margin-top: 10px;
        }

        /* 服务区块样式 */
        .services {
            display: flex;
            justify-content: space-around;
            padding: 50px 20px;
            background-color: #ecf0f1;
        }

        .service-item {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 30%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .service-item h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .service-item p {
            font-size: 16px;
            color: #7f8c8d;
        }

        /* 关于我们部分 */
        .about {
            padding: 50px 20px;
            background-color: #ffffff;
            text-align: center;
        }

        .about h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .about p {
            font-size: 18px;
            color: #7f8c8d;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 联系我们部分 */
        .contact {
            background-color: #34495e;
            color: white;
            padding: 50px 20px;
            text-align: center;
        }

        .contact h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .contact p {
            font-size: 18px;
        }

        .contact a {
            color: #ecf0f1;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            display: inline-block;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        /* 页脚样式 */
        footer {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav>
        <a href="#">首页</a>
        <a href="#">服务</a>
        <a href="#">关于我们</a>
        <a href="#">联系我们</a>
    </nav>

    <!-- 首页大图 -->
    <section class="hero">
        <h1>欢迎来到我们的网站</h1>
        <p>提供专业的服务，助您迈向成功</p>
    </section>

    <!-- 服务区块 -->
    <section class="services">
        <div class="service-item">
            <h3>服务 1</h3>
            <p>描述我们的第一项服务。</p>
        </div>
        <div class="service-item">
            <h3>服务 2</h3>
            <p>描述我们的第二项服务。</p>
        </div>
        <div class="service-item">
            <h3>服务 3</h3>
            <p>描述我们的第三项服务。</p>
        </div>
    </section>

    <!-- 关于我们 -->
    <section class="about">
        <h2>关于我们</h2>
        <p>我们是一个致力于为客户提供高质量服务的公司。我们的团队充满激情并富有创造力，致力于为每一位客户提供个性化的解决方案。</p>
    </section>

    <!-- 联系我们 -->
    <section class="contact">
        <h2>联系我们</h2>
        <p>如果您有任何问题或需要更多信息，请随时联系我们。</p>
        <a href="mailto:contact@example.com">发送邮件</a>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2025 网站名称. 保留所有权利。</p>
    </footer>

</body>
</html>
